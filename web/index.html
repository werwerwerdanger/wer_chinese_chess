<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国象棋 — wer-chess</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #2c2c2c;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      display: flex;
      gap: 24px;
      padding: 24px;
    }
    .board-panel { position: relative; }
    canvas {
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      cursor: pointer;
      display: block;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 260px;
    }
    h1 { font-size: 20px; color: #f0d9b5; }
    .status {
      background: #3a3a3a;
      border-radius: 6px;
      padding: 12px;
      font-size: 15px;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .buttons { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background: #5b3a1e;
      color: #f0d9b5;
      cursor: pointer;
    }
    button:hover { background: #7a4f2a; }
    .moves {
      background: #3a3a3a;
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      font-family: Consolas, monospace;
      height: 320px;
      overflow-y: auto;
      line-height: 1.7;
    }
    .moves::-webkit-scrollbar { width: 6px; }
    .moves::-webkit-scrollbar-thumb { background: #5b3a1e; border-radius: 3px; }
    .hint { font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="app">
    <div class="board-panel">
      <canvas id="board" width="600" height="600"></canvas>
    </div>
    <div class="side-panel">
      <h1>中国象棋</h1>
      <div class="status" id="status">加载中…</div>
      <div class="buttons">
        <button id="btn-undo">悔棋</button>
        <button id="btn-reset">重开</button>
      </div>
      <div class="moves" id="moves"></div>
      <div class="hint">点击己方棋子选中，再点击绿点落子</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
